<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Room 1863 - SMART AC MONITOR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 25px;
            background: #06172d;
            color: white;
        }

        /* ปุ่มย้อนกลับ */
        .back {
            display: inline-block;
            color: white;
            text-decoration: none;
            background: #0b223e;
            border: 2px solid #2196ff;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 18px;
            transition: 0.2s;
        }

        .back:hover {
            background: #2196ff;
            transform: translateX(-3px);
        }

        /* หัวเว็บ */
        h1 {
            text-align: center;
            font-size: 40px;
            margin: 15px 0 8px;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: #9fb4cc;
            margin-bottom: 30px;
        }

        /* ชื่อห้อง */
        .room-title {
            max-width: 900px;
            margin: auto;
            text-align: center;
            padding: 20px;
            background: #0b223e;
            border: 2px solid #2196ff;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(33, 150, 255, 0.2);
        }

        .room-title h2 {
            margin: 0;
            font-size: 32px;
        }

        /* Layout การ์ด */
        .content {
            max-width: 900px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        /* การ์ด */
        .card {
            background: #0b223e;
            border: 2px solid #187bc8;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(33, 150, 255, 0.15);
        }

        .card h3 {
            margin-top: 0;
            font-size: 22px;
            border-bottom: 1px solid #24577f;
            padding-bottom: 12px;
        }

        /* สถานะห้อง */
        .room-status {
            color: #35e86b;
            font-size: 22px;
            font-weight: bold;
            margin: 15px 0;
        }

        .aircon {
            color: #65bfff;
            font-size: 18px;
        }

        /* ข้อมูลอุปกรณ์ */
        .device {
            background: #071a30;
            border-radius: 10px;
            padding: 15px;
            margin-top: 12px;
        }

        .device-name {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .data {
            color: #b8c9dd;
            line-height: 1.8;
        }

        .value {
            color: white;
            font-weight: bold;
        }

        /* ปุ่มเพิ่มอุปกรณ์ */
        .add-button {
            width: 100%;
            margin-top: 15px;
            padding: 13px;
            border: 2px solid #2196ff;
            border-radius: 10px;
            background: #1266a3;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-button:hover {
            background: #2196ff;
            transform: translateY(-2px);
        }

        /* อัปเดต */
        .update {
            max-width: 900px;
            margin: 20px auto 0;
            padding: 15px;
            text-align: center;
            color: #9fb4cc;
            background: #0b223e;
            border: 2px solid #187bc8;
            border-radius: 12px;
        }

        /* มือถือ */
        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            h1 {
                font-size: 28px;
                margin-top: 18px;
            }

            .subtitle {
                font-size: 14px;
            }

            .room-title {
                padding: 16px;
            }

            .room-title h2 {
                font-size: 26px;
            }

            .content {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .card {
                padding: 16px;
            }

            .card h3 {
                font-size: 20px;
            }

            .room-status {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- ปุ่มกลับหน้าแรก -->
    <a href="index.html" class="back">← กลับหน้าหลัก</a>


    <!-- หัวเว็บ -->
    <h1>SMART AC MONITOR</h1>

    <div class="subtitle">
        ระบบตรวจสอบสถานะการทำงานของเครื่องปรับอากาศ
    </div>


    <!-- ชื่อห้อง -->
    <div class="room-title">
        <h2>ROOM 1863</h2>
    </div>


    <!-- ข้อมูล -->
    <div class="content">

        <!-- สถานะห้อง -->
        <div class="card">

            <h3>สถานะห้อง</h3>

            <div class="room-status">
                🟢 กำลังทำงาน
            </div>

            <div class="aircon">
                ❄️ แอร์: เปิด
            </div>

        </div>


        <!-- อุปกรณ์ -->
        <div class="card">

            <h3>อุปกรณ์ภายในห้อง</h3>

            <div class="device">

                <div class="device-name">
                    🌡️ DS18B20
                </div>

                <div class="data">
                    อุณหภูมิ:
                    <span class="value">25.5 °C</span>
                    <br>

                    ความชื้น:
                    <span class="value">60%</span>
                </div>

            </div>

            <button class="add-button">
                ＋ เพิ่มอุปกรณ์
            </button>

        </div>

    </div>


    <!-- เวลาอัปเดต -->
    <div class="update">
        ↻ อัปเดตข้อมูลล่าสุด :
        <strong>20:41:23</strong>
    </div>

</body>
</html>
